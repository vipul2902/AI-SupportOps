# Production-style stack. Single public entry point (nginx); everything else is internal.
#
#   cp .env.prod.example .env.prod      # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from docker-compose.yml (development):
#   - only `web` publishes a port; Postgres and Redis are unreachable from the host
#   - Redis requires a password
#   - migrations run once in the `migrate` job; the API starts only after it succeeds
#   - containers: non-root, read-only root filesystem, all capabilities dropped, resource limits
#   - ASPNETCORE_ENVIRONMENT=Production (no auto-migrate, JSON logs, fail-fast config checks)
#
# TLS: terminate HTTPS in front of `web` (cloud load balancer / ingress). The refresh cookie is
# Secure, so browsers send it only over HTTPS (http://localhost is the one exception).
name: aisupportops-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg17
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] # entrypoint initialises the data dir, then drops to the postgres user
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    networks: [backend]

  redis:
    <<: *hardening
    image: redis:7-alpine
    # Run as the image's non-root redis user directly (no root-then-drop step, so no SETUID capability).
    user: "999:1000"
    # Cache-only: Redis holds disposable data (embedding cache, rate counters), so persistence is off.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320m }
    networks: [backend]

  # One-shot schema migration with the API image. `api` waits for it to exit successfully.
  migrate:
    <<: *hardening
    image: aisupportops-api:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: src/Api/Dockerfile }
    command: ["--migrate-only"]
    restart: "no"
    read_only: true
    healthcheck: { disable: true }   # a one-shot job, not a service
    environment: &api-env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Auth__SigningKey: ${JWT_SIGNING_KEY:?}
      Ai__Provider: ${AI_PROVIDER:?set OpenAI or Fake}
      Ai__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Ai__OpenAI__ChatModel: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      # Trust X-Forwarded-For only from nginx's network (the "frontend" subnet below).
      ForwardedHeaders__KnownNetworks__0: 172.31.10.0/24
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *hardening
    image: aisupportops-api:${IMAGE_TAG:-local}
    pull_policy: never                # built by the migrate service (same image)
    read_only: true
    tmpfs: [/tmp]
    environment: *api-env
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }
    networks: [backend, frontend]

  web:
    <<: *hardening
    image: aisupportops-web:${IMAGE_TAG:-local}
    build: { context: src/Web }
    read_only: true
    # Root FS stays read-only; nginx (uid 101) renders its config template into this tmpfs at startup.
    tmpfs: ["/tmp:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101,mode=0755"]
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    networks: [frontend]

networks:
  backend:
    internal: true        # no route to the internet: Postgres/Redis are unreachable from outside
  frontend:
    ipam:
      config:
        - subnet: 172.31.10.0/24

volumes:
  postgres-data:
  uploads:
