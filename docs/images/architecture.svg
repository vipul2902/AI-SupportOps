<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AI-SupportOps architecture</title>
  <desc id="d">Browser to nginx web container to ASP.NET Core API (modular monolith) to PostgreSQL with pgvector, Redis, Blob storage, and the OpenAI API; a background ingestion worker and telemetry export.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <g fill="none" stroke="#1f2937" stroke-width="1.5">
    <!-- client and edge -->
    <rect x="30" y="230" width="130" height="70" rx="8"/>
    <rect x="210" y="230" width="150" height="70" rx="8"/>
    <!-- API boundary -->
    <rect x="410" y="60" width="300" height="440" rx="10" stroke-dasharray="6 4"/>
    <rect x="430" y="100" width="260" height="44" rx="6"/>
    <rect x="430" y="156" width="260" height="44" rx="6"/>
    <rect x="430" y="212" width="260" height="128" rx="6"/>
    <rect x="430" y="352" width="260" height="44" rx="6"/>
    <rect x="430" y="408" width="260" height="70" rx="6"/>
    <!-- data and AI -->
    <rect x="760" y="70" width="170" height="64" rx="8"/>
    <rect x="760" y="160" width="170" height="64" rx="8"/>
    <rect x="760" y="250" width="170" height="64" rx="8"/>
    <rect x="760" y="340" width="170" height="64" rx="8"/>
    <rect x="760" y="430" width="170" height="64" rx="8"/>
  </g>
  <g fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="265" x2="208" y2="265"/>
    <line x1="360" y1="265" x2="428" y2="265"/>
    <line x1="690" y1="102" x2="758" y2="102"/>
    <line x1="690" y1="192" x2="758" y2="192"/>
    <line x1="690" y1="282" x2="758" y2="282"/>
    <line x1="690" y1="372" x2="758" y2="372"/>
    <line x1="690" y1="462" x2="758" y2="462"/>
  </g>
  <g fill="#111827" font-size="14">
    <text x="95" y="261" text-anchor="middle" font-weight="600">Browser</text>
    <text x="95" y="280" text-anchor="middle" font-size="12" fill="#4b5563">React SPA</text>
    <text x="285" y="255" text-anchor="middle" font-weight="600">nginx (web)</text>
    <text x="285" y="274" text-anchor="middle" font-size="12" fill="#4b5563">SPA + /api proxy</text>
    <text x="285" y="290" text-anchor="middle" font-size="12" fill="#4b5563">SSE unbuffered, CSP</text>
    <text x="560" y="86" text-anchor="middle" font-weight="600">ASP.NET Core API (modular monolith)</text>
    <text x="560" y="127" text-anchor="middle">Auth · JWT · RBAC · tenant context</text>
    <text x="560" y="183" text-anchor="middle">Rate limits · ProblemDetails · OTel</text>
    <text x="560" y="236" text-anchor="middle" font-weight="600">Application modules</text>
    <text x="560" y="258" text-anchor="middle" font-size="13">Documents · Knowledge (RAG)</text>
    <text x="560" y="278" text-anchor="middle" font-size="13">Chat (SSE) · Agent + Tools</text>
    <text x="560" y="298" text-anchor="middle" font-size="13">Tickets · Evaluation · Audit</text>
    <text x="560" y="322" text-anchor="middle" font-size="12" fill="#4b5563">EF Core · global tenant filters</text>
    <text x="560" y="379" text-anchor="middle">Ingestion worker (background)</text>
    <text x="560" y="436" text-anchor="middle" font-weight="600">Migration job</text>
    <text x="560" y="456" text-anchor="middle" font-size="12" fill="#4b5563">same image, --migrate-only,</text>
    <text x="560" y="470" text-anchor="middle" font-size="12" fill="#4b5563">runs before each rollout</text>
    <text x="845" y="97" text-anchor="middle" font-weight="600">PostgreSQL</text>
    <text x="845" y="116" text-anchor="middle" font-size="12" fill="#4b5563">+ pgvector (HNSW)</text>
    <text x="845" y="187" text-anchor="middle" font-weight="600">Redis</text>
    <text x="845" y="206" text-anchor="middle" font-size="12" fill="#4b5563">cache · rate limits</text>
    <text x="845" y="277" text-anchor="middle" font-weight="600">OpenAI API</text>
    <text x="845" y="296" text-anchor="middle" font-size="12" fill="#4b5563">embeddings · chat · tools</text>
    <text x="845" y="367" text-anchor="middle" font-weight="600">Blob storage</text>
    <text x="845" y="386" text-anchor="middle" font-size="12" fill="#4b5563">uploaded documents</text>
    <text x="845" y="457" text-anchor="middle" font-weight="600">Telemetry</text>
    <text x="845" y="476" text-anchor="middle" font-size="12" fill="#4b5563">OTLP / App Insights</text>
    <text x="30" y="40" font-size="18" font-weight="600">AI-SupportOps: system architecture</text>
    <text x="30" y="535" font-size="12" fill="#4b5563">One public entry point (nginx). API and data stores are internal. Every tenant-owned query is filtered by tenant id.</text>
  </g>
</svg>
