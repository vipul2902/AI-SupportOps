<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Agent tool-calling flow</title>
  <desc id="d">The LLM proposes a tool call; the ToolExecutor checks budget, looks up the tool, authorizes against the user's current role, validates arguments, executes through application services, records the call and audit entry, and returns the result to the LLM.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="38" font-size="18" font-weight="600" fill="#111827">Agent: the model proposes, the code disposes</text>
  <g fill="none" stroke="#1f2937" stroke-width="1.5">
    <rect x="30" y="80" width="140" height="64" rx="8"/>
    <rect x="210" y="80" width="190" height="64" rx="8"/>
    <rect x="440" y="80" width="150" height="64" rx="8"/>
    <rect x="30" y="200" width="900" height="150" rx="10" stroke-dasharray="6 4"/>
    <rect x="50" y="250" width="120" height="76" rx="6"/>
    <rect x="195" y="250" width="120" height="76" rx="6"/>
    <rect x="340" y="250" width="140" height="76" rx="6"/>
    <rect x="505" y="250" width="130" height="76" rx="6"/>
    <rect x="660" y="250" width="120" height="76" rx="6"/>
    <rect x="805" y="250" width="110" height="76" rx="6"/>
    <rect x="640" y="80" width="290" height="64" rx="8"/>
  </g>
  <g fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)">
    <line x1="170" y1="112" x2="208" y2="112"/>
    <line x1="400" y1="112" x2="438" y2="112"/>
    <path d="M515,144 L515,175 L110,175 L110,248"/>
    <line x1="170" y1="288" x2="193" y2="288"/><line x1="315" y1="288" x2="338" y2="288"/>
    <line x1="480" y1="288" x2="503" y2="288"/><line x1="635" y1="288" x2="658" y2="288"/>
    <line x1="780" y1="288" x2="803" y2="288"/>
    <path d="M860,250 L860,188 L560,188 L560,146"/>
    <line x1="590" y1="112" x2="638" y2="112"/>
  </g>
  <g fill="#111827" font-size="13" text-anchor="middle">
    <text x="100" y="108" font-weight="600">User request</text><text x="100" y="126" font-size="11" fill="#4b5563">"create a ticket for…"</text>
    <text x="305" y="104" font-weight="600">Tools offered by role</text><text x="305" y="122" font-size="11" fill="#4b5563">Viewer: read-only tools;</text><text x="305" y="136" font-size="11" fill="#4b5563">Agent+: write tools</text>
    <text x="515" y="108" font-weight="600">LLM</text><text x="515" y="126" font-size="11" fill="#4b5563">proposes tool calls</text>
    <text x="785" y="104" font-weight="600">Final answer</text><text x="785" y="122" font-size="11" fill="#4b5563">when the LLM stops calling tools,</text><text x="785" y="136" font-size="11" fill="#4b5563">or after 6 iterations</text>
    <text x="110" y="280" font-weight="600">Budget</text><text x="110" y="298" font-size="11" fill="#4b5563">≤ 10 calls,</text><text x="110" y="312" font-size="11" fill="#4b5563">≤ 3 writes / run</text>
    <text x="255" y="280" font-weight="600">Lookup</text><text x="255" y="298" font-size="11" fill="#4b5563">registered tools</text><text x="255" y="312" font-size="11" fill="#4b5563">only</text>
    <text x="410" y="280" font-weight="600">Authorize</text><text x="410" y="298" font-size="11" fill="#4b5563">current role from DB</text><text x="410" y="312" font-size="11" fill="#4b5563">≥ tool minimum</text>
    <text x="570" y="280" font-weight="600">Validate</text><text x="570" y="298" font-size="11" fill="#4b5563">typed schema, no</text><text x="570" y="312" font-size="11" fill="#4b5563">unknown fields</text>
    <text x="720" y="280" font-weight="600">Execute</text><text x="720" y="298" font-size="11" fill="#4b5563">same services as</text><text x="720" y="312" font-size="11" fill="#4b5563">REST, timeout</text>
    <text x="860" y="280" font-weight="600">Record</text><text x="860" y="298" font-size="11" fill="#4b5563">tool_executions</text><text x="860" y="312" font-size="11" fill="#4b5563">+ audit (AiAgent)</text>
  </g>
  <text x="50" y="230" font-size="13" font-weight="600" fill="#4b5563">ToolExecutor (application code; the model holds no credentials)</text>
  <g fill="#4b5563" font-size="12">
    <text x="30" y="392">Any failed check returns a structured error to the model (it can correct its arguments) and is still recorded.</text>
    <text x="30" y="412">Tools are tenant-scoped through the same EF filters as the API; prompt injection can propose a call but cannot bypass these checks.</text>
  </g>
</svg>
